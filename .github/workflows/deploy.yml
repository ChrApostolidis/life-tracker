name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP || secrets.HOST }}
          username: ${{ secrets.SERVER_USER || secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY || secrets.KEY }}
          script: |
            cd ~/life-tracker/life-tracker-app
            git pull
            docker compose down
            docker compose up -d --build