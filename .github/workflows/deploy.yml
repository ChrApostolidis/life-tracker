name: Deploy to Server

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST || secrets.SERVER_IP }}
          username: ${{ secrets.DEPLOY_USERNAME || secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY || secrets.SSH_KEY }}
          script: |
            cd ~/life-tracker/life-tracker-app
            git pull
            docker compose down
            docker compose up -d --build