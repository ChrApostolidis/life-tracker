<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <form id="capture">
      <div class="header">
        <p class="eyebrow">Quick capture</p>
        <button type="button" id="open-panel" class="link-button">Today and journal</button>
      </div>

      <div class="field">
        <input
          id="title"
          class="text-input"
          type="text"
          placeholder="What's on your mind?"
          autocomplete="off"
          maxlength="200"
        />
        <button type="button" id="mic" class="mic" aria-label="Dictate" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" />
            <path d="M5 11a7 7 0 0 0 14 0M12 18v3" />
          </svg>
        </button>
      </div>

      <div class="row">
        <div id="when" class="chips" role="radiogroup" aria-label="When">
          <button type="button" class="chip" role="radio" data-choice="inbox" aria-checked="true">Inbox</button>
          <button type="button" class="chip" role="radio" data-choice="today" aria-checked="false">Today</button>
          <button type="button" class="chip" role="radio" data-choice="tomorrow" aria-checked="false">Tomorrow</button>
        </div>
        <button type="button" id="lang" class="chip lang-chip" aria-label="Voice language" hidden>EL</button>
      </div>

      <div class="footer">
        <p id="status" class="status" role="status"></p>
        <kbd>enter</kbd>
      </div>
      <p id="queue" class="status warning" hidden></p>
    </form>
    <script type="module" src="popup.js"></script>
  </body>
</html>
